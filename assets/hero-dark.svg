<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
  <title id="title">Firdavs Baliyev — Python Backend and Applied AI Developer</title>
  <desc id="desc">Animated profile banner for Firdavs Baliyev.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#131b2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="12" y="12" width="876" height="196" rx="26" fill="url(#bg)" stroke="#263244" filter="url(#shadow)"/>
  <circle cx="820" cy="52" r="46" fill="#58a6ff" opacity="0.10">
    <animate attributeName="r" values="42;50;42" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="180" r="28" fill="#a78bfa" opacity="0.09">
    <animate attributeName="cy" values="180;170;180" dur="6s" repeatCount="indefinite"/>
  </circle>

  <rect x="52" y="46" width="6" height="126" rx="3" fill="url(#accent)"/>
  <text x="82" y="88" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" fill="#f0f6fc">Firdavs Baliyev</text>
  <text x="84" y="121" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#9da7b3">Python backend • full-stack • applied AI/ML</text>

  <g font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="16" font-weight="600" fill="#58a6ff">
    <text x="84" y="158" opacity="1">Django &amp; REST APIs
      <animate attributeName="opacity" values="1;1;0;0;0;0" keyTimes="0;0.22;0.28;0.94;0.98;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="84" y="158" opacity="0">PostgreSQL • Redis • Celery
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.34;0.55;0.61;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="84" y="158" opacity="0">PyTorch • scikit-learn • MLOps
      <animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;0.55;0.61;0.88;0.94;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>

  <g transform="translate(715 145)">
    <circle cx="0" cy="0" r="6" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="15" y="5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#9da7b3">building &amp; learning</text>
  </g>
</svg>
