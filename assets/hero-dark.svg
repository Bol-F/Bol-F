<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
  <title id="title">Firdavs Baliyev — Python Backend Developer and Applied AI Engineer</title>
  <desc id="desc">Professional animated GitHub profile banner.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect x="12" y="12" width="936" height="216" rx="20" fill="url(#bg)" stroke="#263244" filter="url(#softShadow)"/>
  <rect x="12" y="12" width="936" height="4" rx="2" fill="url(#accent)"/>

  <!-- Left identity block -->
  <text x="58" y="78" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="37" font-weight="750" letter-spacing="-0.6" fill="#f0f6fc">Firdavs Baliyev</text>
  <text x="60" y="112" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#c9d1d9">Python Backend Developer · Applied AI/ML</text>
  <text x="60" y="145" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#8b949e">Django · PostgreSQL · APIs · Data · MLOps</text>

  <g transform="translate(60 176)">
    <circle cx="5" cy="-4" r="4" fill="#3fb950"/>
    <text x="17" y="0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#8b949e">Tashkent, Uzbekistan</text>
  </g>

  <!-- Right focus card -->
  <rect x="565" y="52" width="333" height="136" rx="14" fill="#0f1722" stroke="#263244"/>
  <text x="590" y="81" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.2" fill="#6e7681">CURRENT FOCUS</text>
  <line x1="590" y1="94" x2="873" y2="94" stroke="#263244"/>

  <g font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="15" font-weight="600" fill="#58a6ff">
    <text x="590" y="128" opacity="1">Django + production APIs
      <animate attributeName="opacity" values="1;1;0;0;0;0" keyTimes="0;0.27;0.33;0.92;0.97;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="590" y="128" opacity="0">Data pipelines + PostgreSQL
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.37;0.59;0.65;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="590" y="128" opacity="0">PyTorch + ML delivery
      <animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;0.59;0.65;0.88;0.94;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="590" y="157" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#8b949e">Building reliable systems from idea to deployment.</text>
</svg>
