<svg xmlns="http://www.w3.org/2000/svg" width="960" height="244" viewBox="0 0 960 244" role="img" aria-labelledby="title desc">
  <title id="title">Firdavs Baliyev — Python Backend Developer and Applied AI/ML</title>
  <desc id="desc">Modern professional GitHub profile banner.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#121827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.52" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="12" y="12" width="936" height="220" rx="22" fill="url(#bg)" stroke="#263244" filter="url(#shadow)"/>
  <rect x="12" y="12" width="936" height="4" rx="2" fill="url(#accent)"/>

  <!-- Identity -->
  <text x="54" y="72" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="37" font-weight="750" letter-spacing="-0.8" fill="#f0f6fc">Firdavs Baliyev</text>
  <text x="55" y="104" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="650" fill="#c9d1d9">Python Backend Developer · Applied AI/ML</text>
  <text x="55" y="133" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#8b949e">Django · PostgreSQL · REST APIs · Data Workflows · MLOps</text>

  <line x1="55" y1="153" x2="503" y2="153" stroke="#30363d"/>

  <text x="55" y="180" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#8b949e">Building reliable backend systems and practical AI products.</text>

  <g transform="translate(55 207)">
    <circle cx="4" cy="-4" r="4" fill="#3fb950"/>
    <text x="16" y="0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#8b949e">Tashkent, Uzbekistan</text>
    <text x="157" y="0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#484f58">•</text>
    <text x="172" y="0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#8b949e">TUIT · Cybersecurity</text>
  </g>

  <!-- Focus card -->
  <rect x="558" y="48" width="342" height="148" rx="16" fill="#101722" stroke="#2b3546"/>
  <text x="584" y="79" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.4" fill="#6e7681">CURRENT FOCUS</text>
  <line x1="584" y1="92" x2="874" y2="92" stroke="#30363d"/>

  <g font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="15" font-weight="650" fill="#58a6ff">
    <text x="584" y="128" opacity="1">Django + production APIs
      <animate attributeName="opacity" values="1;1;0;0;0;0" keyTimes="0;0.26;0.32;0.92;0.97;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="584" y="128" opacity="0">Data pipelines + PostgreSQL
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.36;0.59;0.65;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="584" y="128" opacity="0">PyTorch + ML delivery
      <animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;0.58;0.64;0.88;0.94;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="584" y="158" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#8b949e">From architecture and testing to deployment.</text>

  <g transform="translate(584 179)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.8" font-weight="600">
    <rect x="0" y="0" width="66" height="24" rx="7" fill="#12223d" stroke="#294b7a"/>
    <text x="33" y="16" text-anchor="middle" fill="#7db6ff">PYTHON</text>
    <rect x="74" y="0" width="68" height="24" rx="7" fill="#151c27" stroke="#2b3546"/>
    <text x="108" y="16" text-anchor="middle" fill="#c3ccda">DJANGO</text>
    <rect x="150" y="0" width="82" height="24" rx="7" fill="#151c27" stroke="#2b3546"/>
    <text x="191" y="16" text-anchor="middle" fill="#c3ccda">PYTORCH</text>
  </g>
</svg>