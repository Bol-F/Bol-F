<svg xmlns="http://www.w3.org/2000/svg" width="960" height="244" viewBox="0 0 960 244" role="img" aria-labelledby="title desc">
  <title id="title">Firdavs Baliyev — Python Backend Developer and Applied AI/ML</title>
  <desc id="desc">Modern light GitHub profile banner with backend and AI focus.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f8fc"/>
      <stop offset="0.52" stop-color="#f7f9ff"/>
      <stop offset="1" stop-color="#f4f1ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.52" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93c5fd" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0.24"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Main panel -->
  <rect x="12" y="12" width="936" height="220" rx="22" fill="url(#bg)" stroke="#cfd8e6" filter="url(#shadow)"/>
  <rect x="12" y="12" width="936" height="4" rx="2" fill="url(#accent)"/>

  <!-- Soft decorative elements -->
  <g opacity="0.55">
    <circle cx="903" cy="184" r="78" fill="none" stroke="url(#arc)" stroke-width="20"/>
    <circle cx="903" cy="184" r="48" fill="none" stroke="url(#arc)" stroke-width="12"/>
  </g>
  <g fill="#8b92ff" opacity="0.52">
    <circle cx="878" cy="48" r="2"/><circle cx="892" cy="48" r="2"/><circle cx="906" cy="48" r="2"/><circle cx="920" cy="48" r="2"/>
    <circle cx="878" cy="62" r="2"/><circle cx="892" cy="62" r="2"/><circle cx="906" cy="62" r="2"/><circle cx="920" cy="62" r="2"/>
    <circle cx="878" cy="76" r="2"/><circle cx="892" cy="76" r="2"/><circle cx="906" cy="76" r="2"/><circle cx="920" cy="76" r="2"/>
  </g>

  <!-- Left identity block -->
  <text x="54" y="72" font-family="Inter, SF Pro Display, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="37" font-weight="760" letter-spacing="-0.9" fill="#0f172a">Firdavs Baliyev</text>
  <text x="55" y="104" font-family="Inter, SF Pro Display, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="650" fill="#1e293b">Python Backend Developer · Applied AI/ML</text>
  <text x="55" y="133" font-family="Inter, SF Pro Display, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="500" fill="#475569">Django · PostgreSQL · REST APIs · Data Workflows · MLOps</text>

  <line x1="55" y1="153" x2="503" y2="153" stroke="#d2dae7"/>

  <text x="55" y="180" font-family="Inter, SF Pro Display, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="520" fill="#475569">Building reliable backend systems and practical AI products.</text>

  <g transform="translate(55 207)">
    <circle cx="4" cy="-4" r="4" fill="#2563eb"/>
    <text x="16" y="0" font-family="Inter, SF Pro Display, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="520" fill="#475569">Tashkent, Uzbekistan</text>
    <text x="157" y="0" font-family="Inter, SF Pro Display, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#94a3b8">•</text>
    <text x="172" y="0" font-family="Inter, SF Pro Display, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="520" fill="#475569">TUIT · Cybersecurity</text>
  </g>

  <!-- Current focus card -->
  <rect x="558" y="47" width="342" height="151" rx="17" fill="#f7f9fd" fill-opacity="0.96" stroke="#cfd8e6"/>
  <text x="584" y="78" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.45" fill="#6b7f9e">CURRENT FOCUS</text>
  <line x1="584" y1="92" x2="874" y2="92" stroke="#d6deea"/>

  <text x="584" y="129" font-family="Inter, SF Pro Display, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#4f46e5">OpenAI + Prompt Engineering</text>

  <text x="584" y="158" font-family="Inter, SF Pro Display, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="520" fill="#475569">From architecture and testing to deployment.</text>

  <!-- Equal style pills -->
  <g transform="translate(584 176)" font-family="Inter, SF Pro Display, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10.8" font-weight="650">
    <rect x="0" y="0" width="70" height="25" rx="8" fill="#eef2f7" stroke="#cbd5e1"/>
    <text x="35" y="16.5" text-anchor="middle" fill="#334155">PYTHON</text>

    <rect x="78" y="0" width="72" height="25" rx="8" fill="#eef2f7" stroke="#cbd5e1"/>
    <text x="114" y="16.5" text-anchor="middle" fill="#334155">DJANGO</text>

    <rect x="158" y="0" width="74" height="25" rx="8" fill="#eef2f7" stroke="#cbd5e1"/>
    <text x="195" y="16.5" text-anchor="middle" fill="#334155">OPENAI</text>
  </g>
</svg>