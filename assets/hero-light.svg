<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
  <title id="title">Firdavs Baliyev — Python Backend and Applied AI Developer</title>
  <desc id="desc">Animated profile banner for Firdavs Baliyev.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef3ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3776ab"/>
      <stop offset="0.55" stop-color="#6f42c1"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#1f2937" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="12" y="12" width="876" height="196" rx="26" fill="url(#bg)" stroke="#dbe6f5" filter="url(#shadow)"/>
  <circle cx="820" cy="52" r="46" fill="#3776ab" opacity="0.07">
    <animate attributeName="r" values="42;50;42" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="180" r="28" fill="#6f42c1" opacity="0.06">
    <animate attributeName="cy" values="180;170;180" dur="6s" repeatCount="indefinite"/>
  </circle>

  <rect x="52" y="46" width="6" height="126" rx="3" fill="url(#accent)"/>
  <text x="82" y="88" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" fill="#111827">Firdavs Baliyev</text>
  <text x="84" y="121" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#4b5563">Python backend • full-stack • applied AI/ML</text>

  <g font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="16" font-weight="600" fill="#3776ab">
    <text x="84" y="158" opacity="1">Django &amp; REST APIs
      <animate attributeName="opacity" values="1;1;0;0;0;0" keyTimes="0;0.22;0.28;0.94;0.98;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="84" y="158" opacity="0">PostgreSQL • Redis • Celery
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.34;0.55;0.61;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="84" y="158" opacity="0">PyTorch • scikit-learn • MLOps
      <animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;0.55;0.61;0.88;0.94;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>

  <g transform="translate(715 145)">
    <circle cx="0" cy="0" r="6" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="15" y="5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#4b5563">building &amp; learning</text>
  </g>
</svg>
