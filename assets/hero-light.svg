<svg xmlns="http://www.w3.org/2000/svg" width="960" height="244" viewBox="0 0 960 244" role="img" aria-labelledby="title desc">
  <title id="title">Firdavs Baliyev — Python Backend Developer and Applied AI/ML</title>
  <desc id="desc">Modern professional GitHub profile banner.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f9ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.52" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="12" y="12" width="936" height="220" rx="22" fill="url(#bg)" stroke="#dbe3ef" filter="url(#shadow)"/>
  <rect x="12" y="12" width="936" height="4" rx="2" fill="url(#accent)"/>

  <!-- Identity -->
  <text x="54" y="72" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="37" font-weight="750" letter-spacing="-0.8" fill="#0f172a">Firdavs Baliyev</text>
  <text x="55" y="104" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="650" fill="#334155">Python Backend Developer · Applied AI/ML</text>
  <text x="55" y="133" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#64748b">Django · PostgreSQL · REST APIs · Data Workflows · MLOps</text>

  <line x1="55" y1="153" x2="503" y2="153" stroke="#e2e8f0"/>

  <text x="55" y="180" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#64748b">Building reliable backend systems and practical AI products.</text>

  <g transform="translate(55 207)">
    <circle cx="4" cy="-4" r="4" fill="#22c55e"/>
    <text x="16" y="0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748b">Tashkent, Uzbekistan</text>
    <text x="157" y="0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#cbd5e1">•</text>
    <text x="172" y="0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748b">TUIT · Cybersecurity</text>
  </g>

  <!-- Focus card -->
  <rect x="558" y="48" width="342" height="148" rx="16" fill="#ffffff" stroke="#dfe6ef"/>
  <text x="584" y="79" font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.4" fill="#94a3b8">CURRENT FOCUS</text>
  <line x1="584" y1="92" x2="874" y2="92" stroke="#e2e8f0"/>

  <g font-family="JetBrains Mono, Fira Code, Consolas, monospace" font-size="15" font-weight="650" fill="#2563eb">
    <text x="584" y="128" opacity="1">Django + production APIs
      <animate attributeName="opacity" values="1;1;0;0;0;0" keyTimes="0;0.26;0.32;0.92;0.97;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="584" y="128" opacity="0">Data pipelines + PostgreSQL
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.36;0.59;0.65;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="584" y="128" opacity="0">PyTorch + ML delivery
      <animate attributeName="opacity" values="0;0;0;0;1;1" keyTimes="0;0.58;0.64;0.88;0.94;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="584" y="158" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#64748b">From architecture and testing to deployment.</text>

  <g transform="translate(584 179)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.8" font-weight="600">
    <rect x="0" y="0" width="66" height="24" rx="7" fill="#eff6ff" stroke="#dbeafe"/>
    <text x="33" y="16" text-anchor="middle" fill="#2563eb">PYTHON</text>
    <rect x="74" y="0" width="68" height="24" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="108" y="16" text-anchor="middle" fill="#475569">DJANGO</text>
    <rect x="150" y="0" width="82" height="24" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="191" y="16" text-anchor="middle" fill="#475569">PYTORCH</text>
  </g>
</svg>